name: Precompute popular words

# Daily: compute today's + the next 2 days' words of the day, then rotate through popular
# words that are missing or older than 30 days (at most `limit` words per run). A 20-minute
# wall-clock budget keeps the run short even when Wikimedia throttles the runner (~30 s/word
# was observed on GitHub runners vs ~8 s locally); whatever was computed is still committed.
# Then render Open Graph images for new/refreshed words, rebuild the word pages + sitemap.
on:
  schedule:
    - cron: '17 2 * * *'   # 02:17 UTC daily
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max words to (re)compute in this run'
        default: '60'
      budget:
        description: 'Precompute time budget in minutes'
        default: '20'

permissions:
  contents: write   # commit the results
  pages: write      # request a Pages build after pushing

concurrency:
  group: precompute
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Playwright (OG image rendering) and Pillow (PNG quantization)
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
      - name: Precompute networks (≤3 requests in flight, honours Retry-After)
        timeout-minutes: 30
        run: node tools/precompute.mjs --days 3 --max-age 30 --word-timeout 180 --limit "${{ github.event.inputs.limit || '60' }}" --budget-min "${{ github.event.inputs.budget || '20' }}"
      # The steps below also run if precompute hit its step timeout, so finished words are kept.
      - name: Render Open Graph images
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          node tools/precompute.mjs --index-only
          node tools/render-og.mjs
      - name: Build static word pages, sitemap, robots
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node tools/build-pages.mjs
      - name: Sanity checks
        id: sanity
        if: ${{ !cancelled() }}
        run: |
          node tests/words.test.mjs
          node tools/stamp-sw.mjs --check
          node -e "const r=require('./data/precomputed/index.json'); const n=Object.values(r.langs).reduce((a,b)=>a+b,0); console.log('precomputed words:', n); if(n<21) process.exit(1)"
      - name: Commit and push
        id: push
        if: ${{ !cancelled() && steps.sanity.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          git config user.name "contexter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precomputed w sitemap.xml robots.txt og.png
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -q -m "Precompute $(date -u +%F): $(jq -r '"\(.written) written, \(.failed|length) failed, \(.requests) requests"' data/precomputed/last-run.json 2>/dev/null || echo update)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Request a GitHub Pages build
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq .status || echo "(Pages build request failed; the push may still trigger one)"
