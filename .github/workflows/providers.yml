name: Refresh streaming providers (Zimmer tracker)

# Weekly: fetch "where to watch" data (JustWatch via TMDB) for every film in the Zimmer tracker,
# write home/zimmer/providers.json + self-hosted logos, commit to `app` and redeploy the preview.
# Visitors never contact TMDB. Needs repo secret TMDB_TOKEN (TMDB v4 read access token).
# Note: GitHub runs `schedule` only from the default branch's copy of this file.
on:
  schedule:
    - cron: '23 3 * * 1'   # Mondays 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: providers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: app
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch providers
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node tools/fetch-providers.mjs
      - name: Commit and push
        id: push
        run: |
          git config user.name "synoikon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/zimmer/providers.json home/zimmer/logos
          if git diff --cached --quiet; then echo "Nothing changed"; echo changed=0 >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "Zimmer: refresh streaming providers $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin app && git push -q origin HEAD:app && break; sleep 5; done
          echo changed=1 >> "$GITHUB_OUTPUT"
      - name: Redeploy the preview
        if: ${{ steps.push.outputs.changed == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run preview.yml --ref app -R "${{ github.repository }}"
