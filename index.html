<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>Synoikon — coming soon</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0f1220; color: #e9ecf7;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 750; letter-spacing: -0.03em; }
    p { margin: .6rem 0 0; color: #9aa3c2; font-size: clamp(1rem, 2.6vw, 1.25rem); letter-spacing: .02em; }
  </style>
</head>
<body>
  <main>
    <h1>Synoikon</h1>
    <p>coming soon</p>
  </main>
  <script>
    // Remove the service worker and caches of the app that used to live here.
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
    if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
  </script>
</body>
