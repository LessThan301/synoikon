<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05030f">
  <title>Synoikon · coming soon / demnächst</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; text-align: center; color: #efeaff; background-color: #05030f;
      background-image: radial-gradient(1200px 700px at 85% -10%, rgba(255,61,242,.2), transparent 60%), radial-gradient(900px 600px at 0% 110%, rgba(61,245,255,.16), transparent 60%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .65;
      background: radial-gradient(1px 1px at 20% 30%, #fff 50%, transparent 51%) 0 0/140px 140px, radial-gradient(1px 1px at 70% 60%, #cfc8ff 50%, transparent 51%) 0 0/190px 190px, radial-gradient(1.5px 1.5px at 40% 80%, #bff 50%, transparent 51%) 0 0/260px 260px; }
    @media (prefers-reduced-motion: no-preference) { body::before { animation: tw 6s ease-in-out infinite alternate; } @keyframes tw { from { opacity: .4 } to { opacity: .75 } } }
    main { position: relative; padding: 24px; }
    .logo { display: inline-block; width: 64px; height: 64px; border-radius: 50%; margin-bottom: 14px; box-shadow: 0 0 18px rgba(255,61,242,.6), 0 0 40px rgba(61,245,255,.3);
      background: radial-gradient(circle at 50% 50%, #ff3df2 0 36%, transparent 37%), radial-gradient(circle at 15% 20%, #3d8bff 0 16%, transparent 17%), radial-gradient(circle at 85% 25%, #3df5ff 0 20%, transparent 21%), radial-gradient(circle at 78% 85%, #b6ff5c 0 14%, transparent 15%); }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4.6rem); font-weight: 200; letter-spacing: .18em; text-transform: uppercase;
      background: linear-gradient(90deg, #3df5ff, #ff7af6); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { margin: .7rem 0 0; color: #b3aade; font-size: clamp(1rem, 2.6vw, 1.25rem); letter-spacing: .04em; }
  </style>
</head>
<body>
  <main>
    <span class="logo" aria-hidden="true"></span>
    <h1>Synoikon</h1>
    <p>coming soon <span aria-hidden="true">·</span> <span lang="de">demnächst</span></p>
  </main>
  <script>
    // Remove service workers and caches of the app that used to live here.
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
    if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
  </script>
</body>
</html>
